[workspace]
authors = ["Erik van Sebille <erikvansebille@gmail.com>"]
channels = ["conda-forge"]
name = "Sargassum_growth_model"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
jupyter = "jupyter"

[activation.env]
JUPYTER_CONFIG_DIR = ".jupyter"

[dependencies]
parcels = ">=4.0.3"
ipykernel = ">=7.3.0,<8"
cmocean = ">=4.0.3,<5"
copernicusmarine = ">=2.4.1,<3"
setuptools = ">=83.0.0,<84"
jupyter = ">=1.1.1,<2"
polars = ">=1.43.1,<2"
jupyterlab = ">=4.6.2,<5"

[pypi-dependencies]
sargassum-growth-model = { path = ".", editable = true }
